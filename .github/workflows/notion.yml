name: Sync posts from Notion

# 每小时从 Notion 拉一次勾了「发布」的文章；也可以在 Actions 页面手动运行。
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: notion
        run: pnpm notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      - name: Commit and deploy
        if: steps.notion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "notion-sync@users.noreply.github.com"
          git add src/content/blog public/images/posts
          git commit -m "content: sync posts from Notion"
          git push
          # 用 GITHUB_TOKEN 推送不会触发部署，这里手动启动一次。
          gh workflow run deploy.yml --ref main
